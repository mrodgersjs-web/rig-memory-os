[project]
name = "founder-runtime"
version = "0.1.0"
description = "RIG 24/7 Founder Runtime — Hermes conductor, durable queue, persistent workers, Jake founder loop"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "pytest>=9.1.1",
]

[project.scripts]
founder-runtime = "founder_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["founder_runtime"]
