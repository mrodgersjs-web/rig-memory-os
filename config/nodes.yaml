      - dispatch
      - verifier
      - founder_review
      - morning_brief
      - signal_research
      - web_scrape
    model_routes:
      - hermes-default
      - gbrain-context
    max_concurrency: 2
    lan_address: 192.168.68.51
    tailnet_address: 100.77.193.77          # rig-128gb-mbp
    worker_version: 0.1.0

  # 36GB lane — RIG-36GB-Mac-Studio-2754 (Tailscale 100.89.143.27).
